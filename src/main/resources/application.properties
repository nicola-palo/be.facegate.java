spring.application.name=facegate

# --- FaceGate service ---
# Segreti di sviluppo: in produzione passarli come variabili d'ambiente
facegate.admin-token=${FACEGATE_ADMIN_TOKEN:dev-admin-secret}
facegate.jwt-secret=${FACEGATE_JWT_SECRET:dev-jwt-secret-please-change-me-0123456789abcdef}
facegate.jwt-ttl-seconds=60

# Le foto in upload superano il default di 1MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
